# Stage-5.sim datagen: the plan-model search narrative (token mode).
#
# Trees are generated by the sharded GPU array
# (scripts/datagen/datagen_stage5sim.sbatch -> datagen.sim.parallelize run)
# and packed into the arrows with
#   python -m datagen.build_qa_dataset --config configs/sample_instances/stage5sim.yaml \
#       --stage5sim-pack --shards-dir data/stage5/sim/shards
# The task cannot be computed inside the builder (it needs the two stage-5
# models on a GPU with the batched sampler).

seed: 0
pov: true
output_path: data/stage5/sim

tasks:
  sim_rationale: {num_positions: 200000, num_questions: 1}

splits:
  train:
    shards: ["data/lichess/stage5/train-*.jsonl"]
  val:
    shards: ["data/lichess/stage5/train-*.jsonl"]
    per_task: 200
    num_questions: 1
  test:
    shards: ["data/lichess/stage5/train-*.jsonl"]
    per_task: 500
    num_questions: 1

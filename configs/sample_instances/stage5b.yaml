# Stage-5.b plan datagen: both sides' plans from selfplay simulation.
#
# The pool must come from the simulate sampler
# (configs/sample_positions/simulate.yaml), whose records carry each
# position's engine-pool games as metadata. The builder derives the plans from
# those stored games (datagen.sim.plans — over-representation in the games the
# side to move wins, causal chains, replay-validated rendering) and never
# re-runs a game. Positions where either side has no renderable plan drop out.
#
# NOTE: the current stage-5.b training set was NOT generated through this
# pipeline — it is the two_networks selfplay run's saved games re-verbalized
# with the same datagen.sim.plans logic into data/stage5/plans by
# helpers/jockey_stage5b_plans.py. This config exists for regeneration
# at the main repo's conventions.

seed: 0
pov: true
output_path: data/stage5/plans_regen

tasks:
  plan_eval: {num_positions: 30000, num_questions: 1}

splits:
  train:
    shards: ["data/lichess/stage5b/train-*.jsonl"]
  val:
    shards: ["data/lichess/stage5b/train-*.jsonl"]
    per_task: 200
    num_questions: 1
  test:
    shards: ["data/lichess/stage5b/train-*.jsonl"]
    per_task: 500
    num_questions: 1

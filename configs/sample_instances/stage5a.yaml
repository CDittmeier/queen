# Stage-5.a verdict datagen: '{side} is {verdict} due to {reason}'.
#
# For each pooled position the builder re-runs the verdict classifier
# (datagen.tree.strong_primitives; seeded per position, so the class the sampler
# admitted is re-derived exactly) and stores the machine POV-token sentence as
# the response. The pool must come from the verdict sampler
# (configs/sample_positions/verdict.yaml), which applies the percentile
# thresholds, class acceptances, and per-class caps.
#
# NOTE: the current stage-5.a training set was NOT generated through this
# pipeline — it is the two_networks motif_sft set (presquares variant, with
# the dry-drawish edit) jockeyed into data/stage5/verdict by
# helpers/jockey_stage5a_verdict.py. This config exists for
# regeneration at the main repo's conventions.

seed: 0
pov: true
output_path: data/stage5/verdict_regen

tasks:
  verdict_eval: {num_positions: 200000, num_questions: 1}

splits:
  train:
    shards: ["data/lichess/stage5a/train-*.jsonl"]
  val:
    shards: ["data/lichess/stage5a/train-*.jsonl"]
    per_task: 200
    num_questions: 1
  test:
    shards: ["data/lichess/stage5a/train-*.jsonl"]
    per_task: 500
    num_questions: 1

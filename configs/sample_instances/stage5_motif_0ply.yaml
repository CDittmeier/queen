# Stage-5.motif companion dataset with the motif position shown directly:
# every ordinary game example uses N=0 rather than sampling N from [0, 8].
# Puzzle examples already use N=0 because only their genuine setup ply exists.

seed: 0
pov: true
output_path: data/stage5/motif_0ply

tasks:
  hce_motif_annotation:
    num_positions: 1105936
    num_questions: 1
    lookahead_plies: 0
    source_groups:
      - shards: ["data/lichess/stage5_motifs/train-00[0-7].jsonl"]
        num_positions: 1000000
      - shards: ["data/lichess/stage5_motifs/puzzles/puzzle-*.jsonl"]
        num_positions: 105936
        require_motif_source: tactical

splits:
  train:
    shards: ["data/lichess/stage5_motifs/train-00[0-7].jsonl"]
  val:
    shards:
      - "data/lichess/stage5_motifs/train-008.jsonl"
      - "data/lichess/stage5_motifs/puzzles/puzzle-*.jsonl"
    per_task: 800
    num_questions: 1
    stratify_motifs: true
  test:
    shards: ["data/lichess/stage5_motifs/train-009.jsonl"]
    per_task: 1000
    num_questions: 1

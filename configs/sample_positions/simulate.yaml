# Stage-5.b simulation-position sampling (datagen.sample_positions simulate
# mode): per game, one generically-sampled ply (>= START_PLY, not game-over);
# from each position `n_games` engine-pool games (datagen.sim.games: maia /
# maia3 / lc0 nets over 2200 / Stockfish at 100-10k nodes) are played across
# `workers` processes and stored IN the output record as metadata, so the
# stage-5.b builder derives plans without re-running games. Slow (~minutes per
# position): cap with max_positions and shard across jobs by varying the pgn
# argument / output. Appended + flushed per position; interrupted runs resume.
simulate: true
per_game: 1
n_games: 100
workers: 16
max_positions: 30000

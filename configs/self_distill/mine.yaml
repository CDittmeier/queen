# Example task list: replace filenames/model paths for each recorded experiment.
# Every directory/model path is relative to the repository root.
stage: mine
input_dir: data/self_distill/positions
output_dir: data/self_distill/mined
output_suffix: _mine
start_index: 0
end_index: null  # All tasks; CLI --start-index/--end-index override these bounds.
tasks:
  - stage7_001.scored.jsonl
  - stage7_002.scored.jsonl
parameters:
  model: runs/self-iterate/sol-full-4
  encoder: data/engines/lc0_hf_bt5
  stockfish: data/engines/stockfish_25080907_x64_avx2
  seed: 20260815
  sf_workers: 6
  sf_nodes: 100000
  max_recursions: 5
  max_root_retries: 3
  max_child_retries: 0
  min_clean_ply: 1
  work_batch_size: 1024
  checkpoint_every: 1024
  max_output_tokens: 4096
  max_num_seqs: 256
  use_v1_vllm: false  # V2 default; true resumes a legacy V1 experiment.
  gpu_memory_utilization: 0.70
  temperature: 0.6
  top_k: 20
  top_p: 0.95
  inject_drop: 0.05
  mistake_drop: 0.10
  eval_truth_limit: 0.10

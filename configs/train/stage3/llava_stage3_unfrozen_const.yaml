# Stage-3 training — LLaVA arch, decoder UNFROZEN, warmup-then-CONSTANT LR.
# Warm-starts from the stage-2 checkpoint (unfrozen + constant LR, step 30k),
# then trains on the stage-3 forward tasks with stage-2 and stage-1 data mixed
# back in (86% stage-3 / 8% stage-2 / 6% stage-1).
#
# Launch: sbatch scripts/train/common/train_sft.sbatch configs/train/stage3/llava_stage3_unfrozen_const.yaml
#
# Trains: connector + file/rank embeds + new_embed + the full SmolLM3 decoder.
# Encoder (lc0 BT5) is always frozen. Mirrors the stage-1/stage-2 recipe
# (llava_unfrozen_const) so the only deltas are the data and the warm start.

# --- model ---
arch: llava
lora_rank: 0
dtype: bfloat16
compile: true
compile_mode: default
use_liger_loss: false        # chunked CE path, works under torch.compile
reshard_after_forward: false
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- warm start ---
# Initialize trainable params from the stage-2 checkpoint's portable trainable.pt
# (load_state_dict strict=False), then train from step 0 with a FRESH optimizer,
# scheduler, and data order. NOT --resume-from (which would restore the stage-2
# optimizer + step count). train.py honors `init_from` (weights only), distinct
# from resume.
init_from: runs/stage2_llava_unfrozen_const/step_0030000

# --- data ---
# train_with_mix.arrow = stage-3 train_all (86%, seven forward tasks uniform 1/7)
# concatenated with an 8% uniform sample of the stage-2 train mixture and a 6%
# uniform sample of the stage-1 train mixture (each internally balanced across
# its task types). Built by scripts/datagen/common/mix_datasets.sbatch via
# datagen/mix_arrows.py (--dist 86 8 6). The DataLoader shuffles globally each epoch.
train_dataset: data/stage3/train_with_mix.arrow
eval_dataset:  data/stage3/val_dataset.arrow
num_workers: 4

# --- training ---
batch_size: 8           # per-device micro-batch
grad_accum_steps: 16    # 8 * 16 * 2 GPUs = 256 global
max_seq_len: 512        # matches stage-1/stage-2
n_steps: 30000          # matches stage-1/stage-2 unfrozen-const
lr: 1.0e-5
weight_decay: 0.1
scheduler: constant     # warmup then flat LR (every checkpoint a valid "final")
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000         # also the checkpoint cadence (enables --resume-from)
eval_batch_size: 8
eval_max_new_tokens: 384  # matches stage-1/stage-2
eval_max_examples: 700    # full stage-3 val set (100/task * 7)
log_samples: 4

# --- output ---
exp_name: stage3_llava_unfrozen_const
output_dir: runs

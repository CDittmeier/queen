# Stage-1 training — LLaVA arch, decoder FROZEN, warmup-then-CONSTANT LR.
# Constant LR (no decay) means every checkpoint is a valid "final" model, so you
# can early-stop at whichever step the val metric peaks without a half-decayed LR.
# Launch: sbatch scripts/train/common/train_sft.sbatch configs/train/stage1/llava_frozen_const.yaml
#
# Trains: connector + file/rank embeds + new_embed only.
# Frozen: the full SmolLM3 decoder AND the lc0 BT5 encoder.
#
# LR: lr=2.5e-5 drives the bridge (held constant after warmup); new_embed gets
# lr*0.1 (2.5e-6). No decoder param-group exists (lora_rank<0).

# --- model ---
arch: llava
lora_rank: -1           # <0 = decoder frozen (only the bridge / new params train)
dtype: bfloat16
compile: true           # torch.compile (mode=default); ~1.33x with reshard off (bench 2026-06-16)
compile_mode: default   # reduce-overhead's cudagraphs break on this model
use_liger_loss: false        # chunked CE path, works under torch.compile
reshard_after_forward: false  # 3B fits unsharded on 2x80GB; halves all-gathers
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- data (POV, equal 1,828,572 records/task; concatenated to one arrow) ---
train_dataset: data/stage1/train_all.arrow
eval_dataset:  data/stage1/val_dataset.arrow
num_workers: 4

# --- training ---
batch_size: 8           # per-device micro-batch
grad_accum_steps: 16    # 8 * 16 * 2 GPUs = 256 global
max_seq_len: 512        # fits SmolLM3 system prompt + verbose count-task answers (max ~419 tok)
n_steps: 40000
lr: 2.5e-5
weight_decay: 0.1
scheduler: constant     # warmup_ratio warmup, then flat LR (early-stopping friendly)
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000         # also the checkpoint cadence (enables --resume-from)
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 700  # full val set (100/task * 7)
log_samples: 4

# --- output ---
exp_name: stage1_llava_frozen_const_40k
output_dir: runs

# Exp3 — Flamingo bridge_lr sweep, run 1/3 (baseline).
# Fixed: arch=flamingo, lora_rank=-1 (decoder frozen), cosine + min_lr_rate=0.05.
# Defaults: alpha_init=1.0, wo_rand_init=False (zero-init W_O) — open-gate clean-residual init.
# Swept axis: bridge lr.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo
lora_rank: -1
lr: 1.0e-4              # bridge LR (cosine-decayed); no decoder group since frozen
embed_lr: 1.0e-5        # explicit new_embed LR — overrides the lr*0.1 auto-scale
scheduler: cosine
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR
n_steps: 50000
exp_name: stage1_flamingo_1e-4

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: false
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
train_dataset: data/stage1/train_all.arrow
eval_dataset:  data/stage1/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 700
log_samples: 4

# --- output ---
output_dir: runs/stage1_exp3

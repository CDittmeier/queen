# Stage-1 training — LLaVA arch, decoder UNFROZEN, COSINE LR, 30k steps.
# Replaces the 15k unfrozen run (val was still improving at 15k); the const-LR
# sibling is train_stage1_llava_unfrozen_const_30k.yaml.
# Launch: sbatch scripts/train/common/train_sft.sbatch configs/train/stage1/llava_unfrozen_cos_30k.yaml
#
# Trains: connector + file/rank embeds + new_embed + the full SmolLM3 decoder.
# Encoder (lc0 BT5) is always frozen.
#
# LR: lr=1e-5 drives the bridge; the decoder param-group keeps the built-in 0.1x
# discount (-> decoder effective LR 1e-6), and new_embed gets lr*0.1 (1e-6).

# --- model ---
arch: llava
lora_rank: 0            # 0 = full fine-tune of the decoder (decoder unfrozen)
dtype: bfloat16
compile: true           # torch.compile (mode=default); ~1.33x with reshard off (bench 2026-06-16)
compile_mode: default   # reduce-overhead's cudagraphs break on this model
use_liger_loss: false        # chunked CE path, works under torch.compile
reshard_after_forward: false  # 3B fits unsharded on 2x80GB; halves all-gathers
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- data (POV, equal 1,828,572 records/task; concatenated to one arrow) ---
train_dataset: data/stage1/train_all.arrow
eval_dataset:  data/stage1/val_dataset.arrow
num_workers: 4

# --- training ---
batch_size: 8           # per-device micro-batch
grad_accum_steps: 16    # 8 * 16 * 2 GPUs = 256 global
max_seq_len: 512        # fits SmolLM3 system prompt + verbose count-task answers (max ~419 tok)
n_steps: 30000
lr: 1.0e-5
weight_decay: 0.1
scheduler: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000         # also the checkpoint cadence (enables --resume-from); 30000 is a multiple -> final saved
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 700  # full val set (100/task * 7)
log_samples: 4

# --- output ---
exp_name: stage1_llava_unfrozen_cos_30k
output_dir: runs

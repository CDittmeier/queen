# GRPO continuation of the decoder-frozen Stage-5.sim Flamingo model.
# Initialize both HF and vLLM from the immutable merged step-50k snapshot.

# --- reproducibility ---
seed: 20260810

# --- model ---
arch: flamingo
lora_rank: -1
dtype: bfloat16
model_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs/stage5sim_frozen_grpo_init_step_0050000
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic
activation_checkpointing: true
num_gpus: 4

# vLLM shares the process with the HF policy. Eager execution and disabled
# prefix caching are enforced by rl.py / ChessFlamingoGenerator, not here.
vllm_gpu_memory_utilization: 0.42
vllm_max_num_seqs: 128

# --- data ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/rl/stage5sim_grpo_positions_12k.arrow
eval_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage5/sim/val_dataset.arrow
num_workers: 2

# --- GRPO training ---
# Sixteen positions form independent eight-rollout comparison groups. The HF
# gradient stage sees 128 sequences total, or 32 per GPU. This measured fit
# requires PYTORCH_ALLOC_CONF=expandable_segments:True in the launcher.
batch_size: 16
group_size: 8
max_rollout_length: 4096
# The fixed chat prompt is far below the remaining 256-token allowance.
max_seq_len: 4352
n_steps: 500
reward_function: reward
temperature: 1.0
top_k: -1
top_p: 1.0
repetition_penalty: 1.0
clip_epsilon: 0.2
advantage_epsilon: 1.0e-4

# --- optimizer / scheduler ---
# The decoder stays frozen; lr applies to dense cross-attention and embed_lr
# applies to the added chess-token embeddings.
lr: 1.0e-6
embed_lr: 1.0e-7
weight_decay: 0.1
scheduler: constant
warmup_ratio: 0.10
min_lr_rate: 0.0
max_grad_norm: 1.0
fused_optimizer: true

# --- reward validation ---
# This is the inexpensive in-loop validation currently implemented by rl.py:
# deterministic rows, stochastic rollouts, and production reward statistics.
eval_at_start: true
eval_freq: 25
eval_batch_size: 64
eval_max_examples: 64
log_samples: 8

# --- tactical/general probe validation (evaluation hook still to be implemented) ---
# Run at step 0, every 25 steps, and the final step, with temperature 0 and
# 8,192 output tokens. Report first-move, side-to-move, and exact-prefix
# accuracy using these immutable 100-example samples:
#
# probe_eval_freq: 25
# tactical_probe: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/lab/checkpoint_vibe/puzzle_eval_100_s20260808/sample.json
# general_probe: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/lab/checkpoint_vibe/game_tactic_probe_100_s20260808/sample.json

# --- checkpointing / output ---
save_freq: 25
exp_name: stage5sim_frozen_grpo
output_dir: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs

# Stage-4 (stage4_exp1) — smollm flamingo, bridge_lr sweep (lr=2e-4).
#
# Warm-starts from the Stage-3 test winner (SmolLM3 Flamingo 2.5e-5, step 22k) and trains on Stage-4
# forward-dynamic tasks with 80/8/6/6 Stage-4/3/2/1 data mix. Deltas from the Stage-3 recipe:
# init_from, Stage-4 data, n_steps, eval_max_examples, output_dir/exp_name.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo
lora_rank: -1
lr: 2.0e-4              # bridge LR (cosine-decayed); frozen decoder, no decoder group
embed_lr: ~                 # default: lr * 0.1 auto-scale
scheduler: cosine
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR
n_steps: 100000
exp_name: stage4_smollm_flamingo_2e-4

# --- warm start ---
# Overlay trainable params from the Stage-3 winner's trainable.pt (strict=False),
# then train from step 0 with a FRESH optimizer/scheduler/data order (NOT resume).
init_from: runs/stage3_exp1/stage3_smollm_flamingo_2.5e-5/step_0022000

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: false
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
# train_with_mix.arrow = 80% Stage-4 train_all + 8% Stage-3 + 6% Stage-2 + 6% Stage-1 replay.
train_dataset: data/stage4/train_with_mix.arrow
eval_dataset:  data/stage4/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 600   # full Stage-4 val set (100/task * 6)
log_samples: 4

# --- output ---
output_dir: runs/stage4_exp1

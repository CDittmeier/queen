# Flamingo counterpart to llava_stage5_040_nopuzzles.yaml: the regenerated
# 0/0/40 handcrafted/tree data, game positions only. Decoder frozen; Flamingo
# bridge and new embeddings remain trainable.

# --- model ---
arch: flamingo
lora_rank: -1
dtype: bfloat16
compile: true
compile_mode: default
use_liger_loss: false
reshard_after_forward: true
activation_checkpointing: true
activation_checkpointing_every_n: 2
sync_each_batch: false
attn_implementation: sdpa
decoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/local/SmolLM3-3B
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

fp32_master_weights: true
fsdp_mixed_precision: true
fsdp_reduce_dtype: float32
fused_optimizer: true

init_from: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs/stage4_smollm_flamingo_2e-4/step_0048000

# --- data ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage5/0-0-40/train_all.arrow
eval_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage5/0-0-40/val_dataset.arrow
num_workers: 4
length_grouping: true
length_group_pool_size: 512

# --- training (2 * 32 * 4 GPUs = 256 global) ---
batch_size: 2
grad_accum_steps: 32
max_seq_len: 8192
n_steps: 20000
lr: 1.0e-5
weight_decay: 0.1
scheduler: constant
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
save_freq: 400
eval_freq: 400
eval_loss_only: true
eval_batch_size: 1
eval_max_examples: 200
log_samples: 4

# --- output ---
exp_name: stage5_flamingo_040_nopuzzles_frozen
output_dir: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs

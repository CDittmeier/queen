# Stage-5 on the 2026-08 regenerated 0/0/40 data (d3, tactic-motif labels) with 100k random
# lichess-puzzle positions interleaved — the puzzle arm of the puzzle-mix comparison
# (counterpart: llava_stage5_040_nopuzzles.yaml, same common val split). Training recipe
# identical to llava_stage5_040_fp32.yaml.
# Launch: sbatch scripts/train/common/train_sft.sbatch configs/train/stage5/llava_stage5_040_puzzles100k.yaml

# --- model ---
arch: llava
lora_rank: 0
dtype: bfloat16
compile: true
compile_mode: default
use_liger_loss: false   # chunked CE path, works under torch.compile
reshard_after_forward: true
activation_checkpointing: true
activation_checkpointing_every_n: 2
sync_each_batch: false
attn_implementation: sdpa
decoder_path: local/SmolLM3-3B
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

fp32_master_weights: true
fsdp_mixed_precision: true
fsdp_reduce_dtype: float32
fused_optimizer: true

# --- warm start ---  (stage-4 step_0144000)
init_from: runs/stage4_llava_unfrozen_const/step_0144000

# --- data ---  (same game rows as nopuzzles + 100k puzzles; eval on the common game-only val)
train_dataset: data/stage5/0-0-40-puzzles100k/train_all.arrow
eval_dataset:  data/stage5/0-0-40/val_dataset.arrow
num_workers: 4
length_grouping: true
length_group_pool_size: 512

# --- training ---  (2 * 16 * 8 GPUs = 256 global)
batch_size: 2
grad_accum_steps: 16
max_seq_len: 8192
n_steps: 20000
lr: 1.0e-5
weight_decay: 0.1
scheduler: constant
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
save_freq: 400
eval_freq: 400
eval_loss_only: true
eval_batch_size: 1
eval_max_examples: 200
log_samples: 4

# --- output ---
exp_name: stage5_llava_040_puzzles100k
output_dir: runs

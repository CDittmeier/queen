# Stage-5.sim training: 941,113 completed plan -> tree -> verdict records with
# an explicit critical-line move recommendation (18,471 no-PV rows excluded).
# Recipe matches the completed stage5_llava_040_fp32 run except for the requested
# global batch 64 (2 microbatch * 8 accumulation * 4 GPUs) and this dataset/output.
#
#   sbatch scripts/train/train_stage5_llava_4gpu.sbatch \
#       configs/train/stage5/llava_stage5_sim_fp32_b64.yaml

# --- model ---
arch: llava
lora_rank: 0
dtype: bfloat16
compile: true
compile_mode: default
use_liger_loss: false
reshard_after_forward: true
activation_checkpointing: true
activation_checkpointing_every_n: 2
sync_each_batch: false
attn_implementation: sdpa
decoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/local/SmolLM3-3B
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- precision / optimizer implementation ---
fp32_master_weights: true
fsdp_mixed_precision: true
fsdp_reduce_dtype: float32
fused_optimizer: true

# --- warm start (same stage-4 checkpoint as stage5_llava_040_fp32) ---
init_from: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs/stage4_llava_unfrozen_const/step_0144000

# --- data ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage5/sim/train_all.arrow
eval_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage5/sim/val_dataset.arrow
num_workers: 4
length_grouping: true
length_group_pool_size: 512

# --- training (2 * 8 * 4 GPUs = 64 global) ---
batch_size: 2
grad_accum_steps: 8
max_seq_len: 8192
n_steps: 20000
lr: 1.0e-5
weight_decay: 0.1
scheduler: constant
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
save_freq: 400
eval_freq: 400
eval_loss_only: true
eval_batch_size: 1
eval_max_examples: 200
log_samples: 4

# --- output ---
exp_name: stage5_llava_sim_fp32_b64
output_dir: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/runs

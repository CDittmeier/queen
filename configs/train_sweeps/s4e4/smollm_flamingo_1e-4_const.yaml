# Stage-4 (stage4_exp4) — smollm flamingo, constant LR (lr=1e-4).
#
# Motivation: s4e1 flamingo runs picked best-val at 42-62k out of 100k while
# cosine had decayed to 50-65% of peak; val was still climbing when the LR
# ran out. Rerun with a constant schedule at the same peak LRs that won in
# s4e1 (1e-4, 2e-4) to check whether the argmax was schedule-limited, plus
# one aggressive-LR cosine probe (4e-4) since the s4e1 LR trend hadn't
# turned over. Only deltas from s4e1: scheduler, min_lr_rate removed,
# exp_name, output_dir.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo
lora_rank: -1
lr: 1.0e-4              # bridge LR (constant after warmup); frozen decoder, no decoder group
embed_lr: ~             # default: lr * 0.1 auto-scale
scheduler: constant
n_steps: 100000
exp_name: stage4_smollm_flamingo_1e-4_const

# --- warm start ---
# Overlay trainable params from the Stage-3 winner's trainable.pt (strict=False),
# then train from step 0 with a FRESH optimizer/scheduler/data order (NOT resume).
init_from: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage3_exp1/stage3_smollm_flamingo_2.5e-5/step_0022000

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: false
decoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/local/SmolLM3-3B
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
# train_with_mix.arrow = 80% Stage-4 train_all + 8% Stage-3 + 6% Stage-2 + 6% Stage-1 replay.
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage4/train_with_mix.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage4/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 600   # full Stage-4 val set (100/task * 6)
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage4_exp4

# Stage-2 exp2 (s2e2) — Qwen3-4B Flamingo, bridge_lr sweep 3/3 (lr=2e-5).
#
# Warm-starts from the Stage-1 test winner (Qwen Flamingo, 7.5e-5, step 22k) and trains on Stage-2
# static-tactics with 10% Stage-1 replay. Deltas from the Stage-1 recipe:
# init_from, Stage-2 data, eval_max_examples, output_dir/exp_name.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo
lora_rank: -1
lr: 2.0e-5              # bridge LR (cosine-decayed); frozen decoder, no decoder group
embed_lr: ~                 # default: lr * 0.1 auto-scale
scheduler: cosine
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR
n_steps: 60000
exp_name: stage2_qwen_flamingo_2e-5

# --- warm start ---
# Overlay trainable params from the Stage-1 winner's trainable.pt (strict=False),
# then train from step 0 with a FRESH optimizer/scheduler/data order (NOT resume).
init_from: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage1_exp5/stage1_qwen_flamingo_7.5e-5/step_0022000

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: false
decoder_path: /scratch/gpfs/DANQIC/jeff/models/qwen3-4b
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
# train_with_stage1_mix.arrow = 90% Stage-2 train_all + 10% Stage-1 replay.
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage2/train_with_stage1_mix.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage2/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 600   # full Stage-2 val set (100/task * 6)
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage2_exp2

# Exp4 — Gemma3-4B LLaVA bridge_lr sweep, run 3/3.
# Fixed: arch=llava, lora_rank=0 (full FT), decoder_lr=1e-6, cosine + min_lr_rate=0.05.
# Swept axis: bridge lr.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: llava
lora_rank: 0
lr: 2.0e-4              # bridge LR (cosine-decayed)
decoder_lr: 1.0e-6      # fixed decoder LR
embed_lr: ~                 # default: lr * 0.1 auto-scale
scheduler: cosine
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR (per param group)
n_steps: 20000
exp_name: stage1_gemma_llava_2e-4

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: true   # Gemma3-4B full-FT OOMs at false on A100-80; reshard frees ~2x param mem/rank
decoder_path: local/gemma3-4b
encoder_path: data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
train_dataset: data/stage1/train_all.arrow
eval_dataset:  data/stage1/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 700
log_samples: 4

# --- output ---
output_dir: runs/stage1_exp4

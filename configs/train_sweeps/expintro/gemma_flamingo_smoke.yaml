# Gemma3-4B SMOKE TEST — Flamingo arch, decoder FROZEN (bridge-only).
#   part of: sbatch scripts/train_sweeps/gemma_smoke.sbatch
#
# Purpose: end-to-end validation of the Gemma plumbing, NOT a real recipe.
# Exercises: adapter_for(gemma3) build, FSDP wrap on Gemma3DecoderLayer, the
# Flamingo manual decoder walk under Gemma dual-RoPE + per-layer sliding/global
# masks, new-token embed scaling (sqrt(hidden_size)), one ckpt save/reload, and
# eval generation stopping on <end_of_turn> (chat_template.jinja must be present
# in the decoder dir). A few dozen steps is enough to surface any crash.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo          # {llava, flamingo}
lora_rank: -1           # -1 = decoder frozen (bridge-only)
lr: 1.0e-4              # bridge LR
scheduler: cosine       # {cosine, constant}
n_steps: 20
exp_name: gemma_flamingo_smoke

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true           # match production exp4 (isolation test: does compile trigger the save desync?)
reshard_after_forward: false  # frozen 4B fits unsharded on 2x80GB
decoder_path: /scratch/gpfs/DANQIC/jeff/models/gemma3-4b
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/train_all.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/val_dataset.arrow
num_workers: 4

# --- training (smoke sizing; not the real recipe) ---
batch_size: 4
grad_accum_steps: 4
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.0
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 10           # ckpt cadence = eval cadence; 2 evals at 10/20
eval_batch_size: 8
eval_max_new_tokens: 64 # short: untrained model just needs to exercise the gen loop + stop wiring
eval_max_examples: 14   # 2/task * 7 tasks
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs

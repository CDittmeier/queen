# Stage-1 SWEEP config — Flamingo arch, decoder UNFROZEN, cosine LR.
#   sbatch scripts/train_sweeps/train_stage1_llava.sbatch configs/train_sweeps/flamingo_unfrozen.yaml
#
# Top block lists the params we sweep over; bottom block is fixed across the sweep.
# YAML is unordered, so this grouping is just for ergonomics.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: flamingo          # {llava, flamingo}
lora_rank: 0            # 0 = full fine-tune (decoder unfrozen) | -1 = decoder frozen (bridge-only)
lr: 1.0e-4              # bridge LR (cosine-decayed)
decoder_lr: 1.0e-5      # explicit decoder LR — overrides the default lr*0.1 auto-scale rule
scheduler: cosine       # {cosine, constant}
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR (per param group)
n_steps: 30000
exp_name: stage1_flamingo_unfrozen

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true           # torch.compile (mode=default); ~1.33x with reshard off (bench 2026-06-16)
compile_mode: default   # reduce-overhead's cudagraphs break on this model
reshard_after_forward: false  # 3B fits unsharded on 2x80GB; halves all-gathers
decoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/local/SmolLM3-3B
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data (POV, equal 1,828,572 records/task; concatenated to one arrow) ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/train_all.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/val_dataset.arrow
num_workers: 4

# --- training (sized for global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8           # per-device micro-batch
grad_accum_steps: 16
max_seq_len: 512        # fits SmolLM3 system prompt + verbose count-task answers (max ~419 tok)
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000         # also the checkpoint cadence (enables --resume-from)
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 700  # full val set (100/task * 7)
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs

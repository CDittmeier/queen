# Qwen3-4B SMOKE TEST — LLaVA arch, decoder UNFROZEN (full fine-tune).
#   part of: sbatch scripts/train_sweeps/qwen_smoke.sbatch
#
# Purpose: end-to-end validation of the Qwen3 plumbing, NOT a real recipe.
# Exercises: adapter_for(qwen3) build, FSDP wrap on Qwen3DecoderLayer, the LLaVA
# MLP-prefix path through HF's full Qwen3 forward, identity new-token embed
# scaling (Qwen has no sqrt scaling), the frozen_vocab slice of Qwen's 267
# padding rows + the training_utils vocab assertion, one ckpt save/reload, and
# eval generation stopping on <|im_end|>. This is the memory-tight config (4B
# full-FT, ~Gemma-class) — reshard_after_forward=true + small batch keep it in
# budget; if it OOMs, drop batch_size to 2 and/or raise grad_accum_steps.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: llava             # {llava, flamingo}
lora_rank: 0            # 0 = full fine-tune (decoder unfrozen)
lr: 2.0e-4              # bridge LR
decoder_lr: 1.0e-5      # explicit decoder LR
scheduler: cosine       # {cosine, constant}
n_steps: 20
exp_name: qwen_llava_smoke

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
reshard_after_forward: true   # full-FT 4B (Gemma-class): reshard to stay under 80GB/rank
decoder_path: /scratch/gpfs/DANQIC/jeff/models/qwen3-4b
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/train_all.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage1/val_dataset.arrow
num_workers: 4

# --- training (smoke sizing; not the real recipe) ---
batch_size: 4
grad_accum_steps: 4
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.0
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 10           # ckpt cadence = eval cadence; 2 evals at 10/20
eval_batch_size: 8
eval_max_new_tokens: 64 # short: untrained model just needs to exercise the gen loop + stop wiring
eval_max_examples: 14   # 2/task * 7 tasks
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs

# Stage-4 (stage4_exp2) — gemma llava, bridge_lr sweep (lr=2e-4).
#
# Warm-starts from the Stage-3 test winner (Gemma LLaVA 1e-4, step 12k) and trains on Stage-4
# forward-dynamic tasks with 80/8/6/6 Stage-4/3/2/1 data mix. Deltas from the Stage-3 recipe:
# init_from, Stage-4 data, n_steps, eval_max_examples, output_dir/exp_name.

# =============================================================================
# SWEEP PARAMS
# =============================================================================
arch: llava
lora_rank: 0
lr: 2.0e-4              # bridge LR (cosine-decayed)
decoder_lr: 1.0e-6      # fixed decoder LR
embed_lr: ~                 # default: lr * 0.1 auto-scale
scheduler: cosine
min_lr_rate: 0.05       # cosine floor: decay stops at 5% of peak LR (per param group)
n_steps: 50000
exp_name: stage4_gemma_llava_2e-4

# --- warm start ---
# Overlay trainable params from the Stage-3 winner's trainable.pt (strict=False),
# then train from step 0 with a FRESH optimizer/scheduler/data order (NOT resume).
init_from: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage3_exp2/stage3_gemma_llava_1e-4/step_0012000

# =============================================================================
# FIXED PARAMS
# =============================================================================
# --- model ---
dtype: bfloat16
compile: true
compile_mode: default
reshard_after_forward: true   # 4B full-FT OOMs at false on A100-80; reshard frees ~2x param mem/rank
decoder_path: /scratch/gpfs/DANQIC/jeff/models/gemma3-4b
encoder_path: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/engines/lc0_hf_bt5
embed_init: semantic

# --- data ---
# train_with_mix.arrow = 80% Stage-4 train_all + 8% Stage-3 + 6% Stage-2 + 6% Stage-1 replay.
train_dataset: /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage4/train_with_mix.arrow
eval_dataset:  /scratch/gpfs/DANQIC/ab4197/mydata/p-chess-lm/data/stage4/val_dataset.arrow
num_workers: 4

# --- training (global batch 256 on 2 GPUs: 8 * 16 * 2) ---
batch_size: 8
grad_accum_steps: 16
max_seq_len: 512
weight_decay: 0.1
warmup_ratio: 0.05
max_grad_norm: 1.0

# --- eval / checkpoint ---
eval_freq: 2000
eval_batch_size: 8
eval_max_new_tokens: 384
eval_max_examples: 600   # full Stage-4 val set (100/task * 6)
log_samples: 4

# --- output ---
output_dir: /scratch/gpfs/DANQIC/jeff/p-chess-lm/runs/stage4_exp2

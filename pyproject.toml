[project]
name = "queen-chess"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
mac = [
    "chess>=1.11.2",
    "huggingface-hub>=1.27.0",
    "mlx>=0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.1.3",
    "safetensors>=0.7.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/apple"]
pythonpath = ["."]
